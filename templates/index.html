{% extends 'base.html' %}

{% block title %}Home - Flask Task Selector{% endblock %}

{% block content %}
<section>
  <h2>Choose a task</h2>
  <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
    {% for task in tasks %}
    <article class="task-card">
      <h3>{{ task.id }}. {{ task.name }}</h3>
      <p>{{ task.description }}</p>
      <a class="button" href="/task/{{ task.id }}">Open task</a>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
